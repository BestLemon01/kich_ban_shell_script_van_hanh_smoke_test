version: '3.8'

services:
  backend:
    image: quickbite-user-service:v1
    container_name: quickbite_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/quickbite
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: quickbite_postgres
    environment:
      - POSTGRES_DB=quickbite
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - qb_db_data:/var/lib/postgresql/data

volumes:
  qb_db_data:
